<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magical Hifz Journey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
:root{color-scheme:dark;--bg0:#06142a;--bg1:#0b2142;--vbg:#0a1a33;--card:rgba(13,34,66,.96);--tbbg:rgba(8,22,46,.97);--edge:rgba(224,184,79,.38);--ink:#f5f0e1;--mut:#a9b9d3;--gold:#e0b84f;--emer:#14b08f;--rose:#ef6a82;--field:rgba(255,255,255,.08);--shadow:0 12px 34px rgba(0,0,0,.4);--ring:rgba(255,255,255,.12);--tb:46px;
box-sizing:border-box}
:root[data-theme="day"]{color-scheme:light;--bg0:#e6f0ee;--bg1:#f7faf8;--vbg:#dfe6ea;--card:rgba(255,255,255,.97);--tbbg:rgba(255,255,255,.97);--edge:rgba(185,138,44,.5);--ink:#10304a;--mut:#58708a;--field:rgba(16,48,74,.07);--shadow:0 12px 30px rgba(16,48,74,.18);--ring:rgba(16,48,74,.13)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-size:15px;font-weight:500;background:var(--vbg)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,select,input{font:inherit;color:inherit}
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fixl{direction:ltr}
html[dir=rtl] .btn,html[dir=rtl] .pop,html[dir=rtl] .pill,html[dir=rtl] #tw{direction:rtl}
.card{background:var(--card);border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow)}
/* toolbar */
#tb{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:var(--tbbg);border-bottom:1px solid var(--edge)}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#f7dd84,#c9962b);display:flex;align-items:center;justify-content:center;color:#3a2704;flex:none}
.logo svg{width:19px;height:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--edge);background:var(--field);color:var(--ink);border-radius:12px;padding:7px 12px;font-weight:700;font-size:13.5px;cursor:pointer;transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,#f7dd84,#dca83a);color:#2a1d04;border-color:#f1d27a;box-shadow:0 6px 16px rgba(224,184,79,.3)}
.btn.emer{background:linear-gradient(180deg,#27c9a5,#0f8f74);border-color:#4fe0be;color:#fff;box-shadow:0 6px 16px rgba(20,176,143,.3)}
.btn.rose{background:linear-gradient(180deg,#f58aa0,#d94662);border-color:#f7a6b6;color:#fff}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:10px}
.btn.icon{padding:6px 8px}
.btn.big{width:100%;padding:12px 14px;font-size:17px;border-radius:15px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,.pi:focus-visible,#tw:focus-visible{outline:3px solid var(--emer);outline-offset:2px}
.grp{display:flex;gap:5px;align-items:center}
.sp{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:11px;padding:2px;background:var(--field)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;border-radius:9px;padding:5px 11px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--gold);color:#2a1d04}
input,select{background:var(--field);border:1px solid var(--edge);border-radius:10px;padding:5px 8px;color:var(--ink)}
select option{color:#111}
.pg{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px}
.pg input{width:58px;text-align:center}
.zl{min-width:44px;text-align:center;font-weight:700;font-size:13px;color:var(--gold)}
.pill{border:1px solid var(--edge);background:var(--field);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;font-family:inherit;color:inherit;white-space:nowrap}
.pill.g{background:rgba(224,184,79,.16);color:var(--gold)}
button.pill{cursor:pointer}button.pill:hover{border-color:var(--gold)}
.pop-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 8px);right:0;width:300px;max-height:78vh;overflow:auto;padding:10px;z-index:60;background:var(--card);border:1px solid var(--edge);border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.pi{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:none;color:var(--ink);border-radius:12px;padding:7px 8px;cursor:pointer;text-align:start;font-weight:700;font-size:14px}
.pi:hover{background:var(--field)}.pi.on{background:rgba(224,184,79,.18);border-color:var(--edge)}
.pi small{margin-inline-start:auto;color:var(--mut);font-weight:500;font-size:12px}
.pi.add{color:var(--gold);border:1px dashed var(--edge);justify-content:center;margin-top:6px}
.nm{flex:1}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#27c9a5,#0f8f74);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;overflow:hidden;flex:none;border:1.5px solid var(--gold)}
.av img{width:100%;height:100%;object-fit:cover}
.none{color:var(--mut);text-align:center;padding:10px;font-size:13px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.sh{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);margin:10px 4px 4px}
.sr{display:flex;align-items:center;gap:6px;padding:2px 0}
.sr .open{flex:1;display:block;border:1px solid var(--edge);background:var(--field);border-radius:12px;padding:6px 10px;cursor:pointer;color:var(--ink);text-align:start;font-weight:700}
.sr .open.on{border-color:var(--gold);background:rgba(224,184,79,.16)}
.sr .open small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.sr .x{width:26px;height:26px;border-radius:50%;border:0;background:rgba(239,106,130,.18);color:var(--rose);cursor:pointer;font-weight:800}
.sr .x.arm{width:auto;padding:0 9px;border-radius:13px;background:var(--rose);color:#fff;font-size:11px}
.pb{height:5px;background:var(--ring);border-radius:4px;margin-top:5px;overflow:hidden}.pb i{display:block;height:100%;background:var(--emer)}
.lang{display:flex;border:1px solid var(--edge);border-radius:11px;padding:2px;background:var(--field)}
.lang button{border:0;background:none;border-radius:8px;padding:3px 10px;font-weight:700;font-size:12.5px;cursor:pointer}
.lang button.on{background:var(--gold);color:#2a1d04}
/* viewer: fills the screen like a PDF reader */
#mwrap{position:absolute;top:var(--tb);left:0;right:0;bottom:0;overflow:auto;display:flex;padding-left:96px;background:var(--vbg);scrollbar-width:thin;scrollbar-color:var(--gold) transparent;cursor:default}
body.noroad #mwrap{padding-left:0}
#mwrap.pan{cursor:grabbing;user-select:none}
#mCanvas,#vImg{margin:auto;display:block;max-width:none;border-radius:3px;box-shadow:0 10px 34px rgba(0,0,0,.5)}
#mCover{display:none;margin:auto;padding:30px;font-family:'Amiri','Cairo',serif;font-size:34px;font-weight:700;color:var(--gold);text-align:center}
#mEmpty,#iEmpty{margin:auto;padding:30px;text-align:center;max-width:380px}
#mEmpty p,#iEmpty p{margin:0 0 14px}
#mStat{position:absolute;left:104px;bottom:8px;font-size:12.5px;color:var(--mut);z-index:5}
/* journey road: vertical, wavy, on the left */
#road{position:absolute;left:6px;top:calc(var(--tb) + 26px);bottom:10px;width:84px;z-index:12;pointer-events:none;direction:ltr}
.rgrip{position:absolute;left:50%;transform:translateX(-50%);top:-22px;width:48px;height:20px;border-radius:10px;background:var(--card);border:1px solid var(--edge);color:var(--gold);pointer-events:auto;cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:6;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.rgrip:active{cursor:grabbing}
.rgrip svg{width:20px;height:20px;stroke-width:3}
.rgrip.rsize{top:auto;bottom:-14px;width:40px;height:14px;cursor:ns-resize}
.rgrip.rsize::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--gold)}
body.noroad #road{display:none}
#rsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#rpath{fill:none;stroke:rgba(224,184,79,.28);stroke-width:4;stroke-linecap:round}
#rfill{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-dasharray:0 1;transition:stroke-dasharray .8s}
.stone{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg1);color:var(--gold);border:1.5px solid var(--edge);display:flex;align-items:center;justify-content:center;font-weight:800;z-index:1;transition:background .4s,box-shadow .4s}
.stone.done{background:linear-gradient(180deg,#f7dd84,#dca83a);color:#2a1d04;border-color:#f1d27a;box-shadow:0 0 10px rgba(224,184,79,.7)}
#startm{position:absolute;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(224,184,79,.8)}
#goal{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;color:var(--gold);z-index:1}
#goal svg{width:40px;height:40px;fill:rgba(224,184,79,.28);filter:drop-shadow(0 0 7px rgba(224,184,79,.7))}
#goal.done svg{fill:rgba(224,184,79,.85)}
#kid{position:absolute;transform:translate(-50%,-78%);z-index:3}
#kidin{transform-origin:bottom center;transition:transform .8s}
#tok{position:relative;display:inline-block}
#kimg{height:46px;display:block}
#kname{padding:3px 11px;border-radius:999px;background:linear-gradient(180deg,#27c9a5,#0f8f74);border:1.5px solid var(--gold);color:#fff;font-weight:800;font-size:13px;white-space:nowrap}
.dec{position:absolute;opacity:0;transform:scale(.3);transition:opacity .4s,transform .4s;pointer-events:none;z-index:3}
.dec svg{width:100%;height:auto;display:block}
#aura{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(247,221,132,.55),rgba(247,221,132,0) 68%);opacity:0;transition:opacity .6s;z-index:-1;pointer-events:none}
.spk{position:absolute;width:8px;height:8px;opacity:0;color:#fff3b8}
.spk svg{width:100%;height:100%;fill:currentColor;stroke:none}
.g1 .spk{opacity:1;animation:tw 1.8s ease-in-out infinite}.g1 .spk.b{animation-delay:.6s}.g1 .spk.c{animation-delay:1.2s}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.g2 #dStar,.g3 #dCrown,.g5 #dMedal{opacity:1;transform:none}
.g4 #aura{opacity:.9}.g6 #aura{opacity:1;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.pop-in{animation:popin .6s}
@keyframes popin{0%{transform:scale(.2)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
/* floating timer */
#tw{position:absolute;z-index:35;touch-action:none;user-select:none;cursor:grab;background:var(--card);border:1px solid var(--edge);box-shadow:var(--shadow)}
#tw.mini{width:112px;height:112px;border-radius:50%}
#tw.full{width:312px;border-radius:24px;max-height:calc(100dvh - 60px);overflow:auto;cursor:default}
#tw.dragging{cursor:grabbing}
#twMini{position:relative;width:100%;height:100%;padding:6px}
#twFull{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;text-align:center}
.ringbox{position:relative;aspect-ratio:1;margin:0 auto}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.rbg{stroke:var(--ring)}
.rfg{stroke:url(#gGrad);transition:stroke-dashoffset .25s linear}
.y .rfg{stroke:#f5b13d}.r .rfg{stroke:var(--rose)}
.tdig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;color:var(--gold);line-height:1}
.r .tdig{color:var(--rose);animation:beat 1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
#twMini .tdig{font-size:27px}
#twMini .tsub{font-size:11px;font-weight:700;color:var(--mut);margin-top:3px}
#miniBtn{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;padding:0}
#twFull .ringbox{width:210px}
#twFull .tdig{font-size:60px}
.twh{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:grab;font-weight:800;color:var(--gold);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.twi{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
#phase{font-weight:800;font-size:14px;color:var(--mut)}
#tstate{min-height:1.4em;font-weight:800;color:var(--rose);font-size:15px}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ins label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--mut);text-align:start}
.tin{display:flex;align-items:center;gap:4px;direction:ltr}
.tin input{width:100%;text-align:center}
.pin{display:flex;gap:4px;align-items:center;direction:ltr}
.pin input{text-align:center;font-weight:800;font-size:16px;width:100%;min-width:0}
#ctrl{display:grid;gap:8px}
#ctrl .r2{display:flex;gap:6px}#ctrl .r2 .btn{flex:1}
.twb{display:flex;gap:6px;justify-content:center}
/* dialogs */
dialog{border:1px solid var(--edge);border-radius:24px;padding:24px;width:min(600px,94vw);background:var(--bg1);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.55)}
:root[data-theme="day"] dialog{background:#fff}
dialog::backdrop{background:rgba(3,10,24,.6)}
dialog h2{font-family:'Amiri','Cairo',serif;font-size:26px;margin:0 0 14px;color:var(--gold)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.fg label,.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--mut)}
.fg input,.fg select{width:100%}
.fb{display:flex;align-items:center;gap:10px}
.dh{font-size:12.5px;color:var(--mut);margin:12px 0 0}
.dact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#logList{max-height:55vh;overflow:auto;display:grid;gap:4px}
.ld{font-weight:800;color:var(--gold);margin-top:8px}
.ll{padding:6px 10px;border-radius:10px;background:var(--field);font-size:14px}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.7);background:linear-gradient(180deg,#f9e496,#e0b84f);color:#2a1d04;padding:14px 36px;border-radius:24px;box-shadow:0 18px 44px rgba(224,184,79,.45);opacity:0;pointer-events:none;transition:.3s;z-index:90;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#toast .a,#win .a{font-family:'Amiri','Cairo',serif;font-weight:700;font-size:40px;line-height:1.25}
#toast .e{font-size:17px;font-weight:700}
#note{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0b1220;color:#fff;border:1px solid var(--edge);padding:9px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:95;max-width:92vw;text-align:center}
#note.show{opacity:1}
#win{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(224,184,79,.35),rgba(4,12,30,.94) 62%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:80;color:#fff;text-align:center;overflow:hidden}
#win .a{font-size:clamp(46px,8vw,86px);color:#f7dd84}
#win .e{font-size:clamp(18px,3vw,28px);font-weight:700}
.conf{position:absolute;top:-40px;color:#f7dd84;animation:fall 3.4s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#zoomExit{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline-start:8px;opacity:.5;z-index:85}
body.focus #tb{display:none}
body.focus #zoomExit{display:inline-flex}
body.focus #mwrap{top:0}
body.focus #road{top:8px}
html.lite *{animation:none!important;transition:none!important}
html.lite .card,html.lite .btn,html.lite #tw,html.lite #goal svg{box-shadow:none!important;filter:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zM5 11a7 7 0 0014 0M12 18v3"/></symbol>
<symbol id="i-rub" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/><rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.3 2h3.4l.5 2.4 1.9.8 2.1-1.3 2.4 2.4-1.3 2.1.8 1.9 2.4.5v3.4l-2.4.5-.8 1.9 1.3 2.1-2.4 2.4-2.1-1.3-1.9.8-.5 2.4h-3.4l-.5-2.4-1.9-.8-2.1 1.3-2.4-2.4 1.3-2.1-.8-1.9L2 13.7v-3.4l2.4-.5.8-1.9-1.3-2.1 2.4-2.4 2.1 1.3 1.9-.8z"/><circle cx="12" cy="12" r="3"/></symbol>

function kvSet(k,v){return new Promise(r=>{mem[k]=v;if(!idb)return r(false);try{const x=idb.transaction('kv','readwrite');x.objectStore('kv').put(v,k);x.oncomplete=()=>r(true);x.onerror=()=>r(false);x.onabort=()=>r(false)}catch(e){r(false)}})}
const save=()=>kvSet('state',DBS);
function persist(){const s=stu();if(!s)return;s.cur=S.sid;const r=surah();if(r)r.step=S.step;DBS.last=S.stu;save()}
function shrink(file,max){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/png'))};im.onerror=()=>res(null);im.src=u})}
function getBox(url){return new Promise(res=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,160/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(d[(j*w+i)*4+3]>24){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
  if(x1<0)return res({x0:0,y0:0,x1:1,y1:1,cx:.5});
  const band=y0+Math.max(2,Math.round((y1-y0)*.18));let sx=0,n=0;
  for(let j=y0;j<=band;j++)for(let i=x0;i<=x1;i++)if(d[(j*w+i)*4+3]>24){sx+=i;n++}
  res({x0:x0/w,y0:y0/h,x1:(x1+1)/w,y1:(y1+1)/h,cx:n?(sx/n)/w:.5})};
  im.onerror=()=>res({x0:0,y0:0,x1:1,y1:1,cx:.5});im.src=url})}
async function loadAvatars(){AV={};BOX={};for(const n in DBS.students){const s=DBS.students[n];if(s.kid){AV[n]=await kvGet('img:'+s.kid);if(AV[n])BOX[n]=s.box||await getBox(AV[n])}}}

/* ---------- viewer: mushaf (original PDF, never altered) and student images ---------- */
const imgList=()=>{const s=stu();return s?(s.imgs=s.imgs||[]):[]};
async function openPdf(blob){
  $('mStat').textContent=t('loadingM');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    class BlobRT extends pdfjsLib.PDFDataRangeTransport{
      constructor(b){super(b.size,new Uint8Array(0));this.b=b}
      requestDataRange(a,e){this.b.slice(a,e).arrayBuffer().then(x=>this.onDataRange(a,new Uint8Array(x)))}
    }
    pdfDoc=await pdfjsLib.getDocument({range:new BlobRT(blob),length:blob.size,disableAutoFetch:true,disableStream:true,rangeChunkSize:65536}).promise;
  }catch(e){pdfDoc=null;$('mStat').textContent=t('failM');updateViewer();return false}
  $('mTot').textContent=pdfDoc.numPages;$('mPg').max=pdfDoc.numPages;$('mStat').textContent='';
  await buildSur();updateViewer();await showPage(curPage);return true;
}
async function buildSur(){
  SUR=[];
  try{const ol=await pdfDoc.getOutline()||[];
    for(const it of ol){let d=it.dest;if(typeof d==='string')d=await pdfDoc.getDestination(d);if(!d)continue;const p=await pdfDoc.getPageIndex(d[0]);SUR.push({title:it.title.trim(),page:p+1})}}catch(e){}
  [['mSur',null],['uPick','pickSur']].forEach(([id,f])=>{const sel=$(id);sel.innerHTML=f?'<option value="">'+t(f)+'</option>':'';SUR.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+x.title;sel.appendChild(o)})});
}
function zoomCss(nw,nh,cap){
  const w=$('mwrap'),gut=parseFloat(getComputedStyle(w).paddingLeft)||0,aw=Math.max(120,w.clientWidth-gut-24),ah=Math.max(120,w.clientHeight-24);
  return ZM==='num'?ZS:ZM==='width'?Math.min(aw/nw,3):Math.min(aw/nw,ah/nh,cap);
}
async function showPage(n){
  if(!pdfDoc)return;
  n=Math.min(Math.max(1,Math.round(+n)||1),pdfDoc.numPages);curPage=n;
  const page=await pdfDoc.getPage(n),base=page.getViewport({scale:1}),wrap=$('mwrap');
  const css=zoomCss(base.width,base.height,2);lastCss=css;
  const dpr=window.devicePixelRatio||1,sc=Math.min(css*dpr,3.5),vp=page.getViewport({scale:sc}),c=$('mCanvas');
  if(rTask){try{rTask.cancel()}catch(e){}}
  c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
  c.style.width=Math.floor(base.width*css)+'px';c.style.height=Math.floor(base.height*css)+'px';
  rTask=page.render({canvasContext:c.getContext('2d'),viewport:vp});
  try{await rTask.promise}catch(e){}
  $('mPg').value=n;$('zl').textContent=Math.round(css*100)+'%';
  let k=-1;SUR.forEach((x,i)=>{if(x.page<=n)k=i});$('mSur').value=k>=0?k:'';
  const r=surah();if(r&&r.page!==n){r.page=n;save()}
  wrap.scrollTop=0;wrap.scrollLeft=0;
}
async function showImage(i){
  const l=imgList();if(!l.length){updateViewer();return}
  ii=Math.min(Math.max(0,i),l.length-1);const id=l[ii].id;
  if(!IU[id]){const b=await kvGet('img:'+id);if(!b){updateViewer();return}IU[id]=URL.createObjectURL(b)}
  const im=$('vImg');$('iCount').textContent=(ii+1)+' / '+l.length;

function fitImg(){
  const im=$('vImg');if(!im.naturalWidth)return;
  const css=zoomCss(im.naturalWidth,im.naturalHeight,2.5);lastCss=css;
  im.style.width=Math.round(im.naturalWidth*css)+'px';im.style.height=Math.round(im.naturalHeight*css)+'px';
  $('zl').textContent=Math.round(css*100)+'%';$('mwrap').scrollTop=0;$('mwrap').scrollLeft=0;
}

/* ---------- journey road: vertical wave on the left ---------- */
let G={W:84,H:500},kt=0,ka=null;
const pos=tt=>{const y=G.H-26-tt*(G.H-60),w=Math.max(1.6,G.H/210),x=G.W/2+Math.sin(tt*Math.PI*2*w)*Math.min(20,G.W/2-16);return[x,y]};
function kidAt(tt,lift){const[x,y]=pos(tt),k=$('kid');k.style.left=x+'px';k.style.top=(y-(lift||0))+'px'}
function moveKid(to,hop){
  cancelAnimationFrame(ka);
  if(!hop||Math.abs(to-kt)<1e-4||document.documentElement.classList.contains('lite')){kt=to;kidAt(kt);return}
  const from=kt,t0=performance.now(),dur=900;
  const f=now=>{const p=Math.min(1,(now-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;kt=from+(to-from)*e;kidAt(kt,Math.sin(p*Math.PI)*18);if(p<1)ka=requestAnimationFrame(f);else kidAt(to)};
  ka=requestAnimationFrame(f);
}
function drawRoad(){
  const r=$('road');if(!r.clientHeight)return;
  G={W:r.clientWidth||84,H:r.clientHeight};
  const pts=[];for(let i=0;i<=140;i++){const[x,y]=pos(i/140);pts.push((i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1))}
  const d=pts.join(' ');$('rpath').setAttribute('d',d);$('rfill').setAttribute('d',d);
  r.querySelectorAll('.stone').forEach(e=>e.remove());
  const size=Math.max(8,Math.min(24,(G.H-60)/S.n*.8));
  for(let i=1;i<S.n;i++){const[x,y]=pos(i/S.n),e=document.createElement('div');e.className='stone';e.dataset.i=i;e.style.cssText='left:'+x+'px;top:'+y+'px;width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.46)+'px';if(size>=17)e.textContent=i;r.appendChild(e)}
  const[gx,gy]=pos(1);$('goal').style.left=gx+'px';$('goal').style.top=gy+'px';
  const[sx,sy]=pos(0);$('startm').style.left=sx+'px';$('startm').style.top=sy+'px';
  renderTrack(false);
}
const stageOf=p=>p>=1?6:p>=.9?5:p>=.75?4:p>=.5?3:p>=.25?2:p>0?1:0;
function renderTrack(hop){
  const p=S.n?S.step/S.n:0,s=stu();

/* ---------- timer: accurate (end-time based), only ticks while running ---------- */
const C=653.45;
let tk=null,lastSec=-1;
const exactMs=()=>S.run?Math.max(0,S.endAt-Date.now()):S.remMs;
function startTick(){if(!tk)tk=setInterval(tick,200)}
function stopTick(){clearInterval(tk);tk=null}
function startRun(){if(S.remMs<=0||!surah())return;S.over=false;S.run=true;S.endAt=Date.now()+S.remMs;lastSec=-1;startTick();renderUI()}
function pauseRun(){if(S.run){S.remMs=exactMs();S.run=false}stopTick()}
function tick(){
  const ms=exactMs(),secs=Math.ceil(ms/1000);
  if(secs!==lastSec){lastSec=secs;if(secs<=10&&secs>0)beep(660,.07)}
  if(ms<=0){S.run=false;S.remMs=0;S.over=true;stopTick();beep(440,.7);setTimeout(()=>beep(440,.5),350);renderUI();return}
  renderTime();
}
function renderTime(){
  const ms=exactMs(),secs=Math.ceil(ms/1000),fr=S.total?Math.min(1,ms/(S.total*1000)):0;
  const cls=S.over?'r':(secs<=10&&S.total>10?'r':(fr<=.3?'y':'g'));
  const off=(C*(1-fr)).toFixed(1);
  ['M','F'].forEach(k=>{$('ring'+k).style.strokeDashoffset=off;$('rb'+k).className='ringbox '+cls});
  $('timeM').textContent=fmt(secs);$('timeF').textContent=fmt(secs);
  $('tstate').textContent=S.over?'انتهى الوقت · Time’s up':'';
}

const b2d=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=()=>r(null);x.readAsDataURL(b)});
function d2b(u){const[h,b]=u.split(','),m=/data:([^;]+)/.exec(h),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m?m[1]:'image/png'})}
async function backup(){
  closePops();const imgs={};
  for(const n in DBS.students){const s=DBS.students[n];if(s.kid)imgs[s.kid]=await kvGet('img:'+s.kid);for(const x of(s.imgs||[])){const b=await kvGet('img:'+x.id);if(b)imgs[x.id]=await b2d(b)}}
  const name='hifz-backup-'+new Date().toISOString().slice(0,10)+'.json',data=JSON.stringify({v:1,state:DBS,imgs});
  try{
    if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');await dl.save({filename:name,data})}
    else{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500)}
    msg('bkOk')
  }catch(x){msg('bkFail')}
}

    for(const k in d.imgs){const v=d.imgs[k];if(v)await kvSet('img:'+k,k.charAt(0)==='i'?d2b(v):v)}
